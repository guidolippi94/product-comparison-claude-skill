*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}

.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 72px}

h1{font-size:clamp(30px,5vw,48px);font-weight:800}

a{color:inherit}

.mono{font-family:var(--font-mono)}

if (!DATA){ document.body.textContent = 'No data.'; return; }
const LOC = (DATA.meta && DATA.meta.locale) || 'en-US';
const LANG = LOC.split('-')[0].toLowerCase();
const L = Object.assign({}, T.en, T[LANG] || {});
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => o[k] != null ? o[k] : m);
document.documentElement.lang = LANG;

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0,2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (let i = 2; i < arguments.length; i++){
    const kids = [].concat(arguments[i]);
    for (const kid of kids){
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
  }
  return el;
}
function safeUrl(u){
  try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : null; }
  catch(e){ return null; }
}
let money;
try { const nf = new Intl.NumberFormat(LOC, {style:'currency', currency:DATA.meta.currency || 'USD'}); money = n => nf.format(n); }
catch(e){ money = n => String(n); }
let dateFmt;
try { const df = new Intl.DateTimeFormat(LOC, {year:'numeric', month:'2-digit', day:'2-digit', timeZone:'UTC'}); dateFmt = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? df.format(new Date(s + 'T00:00:00Z')) : (s || ''); }
catch(e){ dateFmt = s => s || ''; }
const nf1 = new Intl.NumberFormat(LOC, {minimumFractionDigits:1, maximumFractionDigits:1});
const one = n => nf1.format(Math.round(n * 10) / 10);
const nfAny = new Intl.NumberFormat(LOC);

document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = L[e.dataset.i18n] || '');
document.querySelectorAll('[data-i18n-ph]').forEach(e => e.setAttribute('placeholder', L[e.dataset.i18nPh] || ''));
document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', L[e.dataset.i18nAria] || ''));

const P = DATA.products, C = DATA.criteria;
const byId = {}; P.forEach(p => byId[p.id] = p);
const state = { w: Object.fromEntries(C.map(c => [c.id, c.weight])), hidden:new Set(), diff:false, hi:true, sort:false, q:'' };

/* ---------- calculations ---------- */
function scores(){
  const sum = C.reduce((a,c) => a + state.w[c.id], 0), out = {};
  P.forEach(p => { let t = 0; if (sum > 0) C.forEach(c => t += state.w[c.id] * (p.scores[c.id] || 0)); out[p.id] = sum > 0 ? t / sum : 0; });
  return out;
}
function bestOffer(p){
  let b = null;
  (p.offers || []).forEach(o => { if (o.price != null && o.verified !== false && (!b || o.price < b.price)) b = o; });
  return b;
}
const ranking = sc => P.slice().sort((a,b) => sc[b.id] - sc[a.id]);
const ordered = sc => state.sort ? ranking(sc) : P.slice();
function num(v){
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v && typeof v === 'object' && typeof v.n === 'number') return v.n;
  return null;
}
function txt(v){
  if (v === true) return L.yes;
  if (v === false) return L.no;
  if (v == null || v === '') return L.na;
  if (typeof v === 'object') return v.t != null ? String(v.t) : L.na;
  return typeof v === 'number' ? nfAny.format(v) : String(v);
}
function srcLinks(f){
  return (f == null ? [] : [].concat(f)).map(id => h('sup', null, h('a', {href:'#source-' + id, title:id}, '[' + id + ']')));
}
const ext = {target:'_blank', rel:'noopener noreferrer nofollow'};

/* ---------- render ---------- */
function renderHeader(){
  const m = DATA.meta;
  $('#kicker').textContent = [m.category, m.market, fill(L.updated, {date:dateFmt(m.date)})].filter(Boolean).join(' · ');
  $('#title').textContent = m.title;
  $('#summary').textContent = DATA.summary;
  if (m.example) $('#demo').hidden = false;
  const e = DATA.needs || {}, box = $('#needs');
  const add = (l, v) => v && box.append(h('li', {class:'chip'}, h('b', {text:l + ':'}), ' ' + v));
  add(L.usage, e.usage); add(L.budget, e.budget);
  (e.priorities || []).forEach((p,i) => add(fill(L.priority, {n:i + 1}), p));
  (e.constraints || []).forEach(v => add(L.constraint, v));
}
function renderPick(){
  const s = DATA.pick, p = byId[s.product_id], o = bestOffer(p), url = o && safeUrl(o.url);
  const off = safeUrl(p.official_url);
  const left = h('div', null,
    h('span', {class:'flag', text:L.flag}),
    h('h3', {text:p.name}),
    h('ul', null, (s.reasons || []).map(m => h('li', {text:m}))),
    s.not_for_you_if && h('div', {class:'notfor'}, h('b', {text:L.notfor}), s.not_for_you_if));
  const right = h('div', {class:'pricebox'},
    h('div', {class:'amount', text: o ? money(o.price) : L.price_unverified}),
    h('div', {class:'small', text: o ? [o.store, fill(L.verified_on, {date:dateFmt(o.date)}), o.shipping].filter(Boolean).join(' · ') : L.price_unverified_hint}),
    url ? h('a', Object.assign({class:'btn primary go', href:url}, ext), L.go) : (off && h('a', Object.assign({class:'btn go', href:off}, ext), L.official)),
    h('div', {style:'margin-top:12px'}, h('span', {class:'badge ' + p.data_confidence, text:L['c_' + p.data_confidence] || p.data_confidence})));
  $('#pick-box').append(h('div', {class:'pick'}, left, right));
  (s.alternatives || []).forEach(a => {
    const q = byId[a.product_id]; if (!q) return;
    const bo = bestOffer(q);
    $('#alts').append(h('div', {class:'alt'},
      h('div', {class:'who', text:a.profile}),
      h('b', {text:q.name + (bo ? ' · ' + money(bo.price) : '')}),
      h('span', {class:'muted', text:a.why})));
  });
}
function renderCards(){
  const sc = scores(), rk = ranking(sc), box = $('#cards');
  box.replaceChildren();
  P.forEach(p => {
    const o = bestOffer(p), pos = rk.indexOf(p) + 1, url = o && safeUrl(o.url), isPick = p.id === DATA.pick.product_id;
    box.append(h('article', {class:'card' + (isPick ? ' is-pick' : '')},
      h('div', {class:'head'},
        h('div', null, h('div', {class:'brand', text:p.brand || ''}), h('h3', {text:p.name})),
        h('div', {class:'score'}, one(sc[p.id]), h('small', null, '/10 · ', h('span', {class:'rank'}, '#' + pos)))),
      h('div', {class:'chips'},
        isPick && h('span', {class:'badge high', text:L.flag}),
        h('span', {class:'badge ' + p.data_confidence, text:L['c_' + p.data_confidence] || p.data_confidence})),
      h('ul', {class:'pro'}, (p.pros || []).map(x => h('li', {text:x}))),
      h('ul', {class:'con'}, (p.cons || []).map(x => h('li', {text:x}))),
      h('div', {class:'foot'},
        h('b', {class:'mono', text: o ? money(o.price) : L.na}),
        url ? h('a', Object.assign({class:'btn go', href:url}, ext), o.store) : null)));
  });
}
function renderSliders(){
  const box = $('#sliders'); box.replaceChildren();
  C.forEach(c => {
    const val = h('span', {class:'mono', text:String(state.w[c.id])});
    const input = h('input', {type:'range', min:'0', max:'100', step:'5', value:String(state.w[c.id]), id:'w-' + c.id,
      oninput: e => { state.w[c.id] = +e.target.value; val.textContent = e.target.value; refresh(); }});
    box.append(h('div', {class:'slider'}, h('label', {for:'w-' + c.id}, h('span', {text:c.name}), val), input, c.description && h('div', {class:'desc', text:c.description})));
  });
}
function renderRanking(){
  const sc = scores(), rk = ranking(sc), box = $('#ranking'); box.replaceChildren();
  rk.forEach((p,i) => box.append(h('div', {class:'bar' + (i === 0 ? ' first' : '')},
    h('span', {class:'name', title:p.name, text:p.name}),
    h('div', {class:'track'}, h('div', {class:'fill', style:'width:' + (sc[p.id] * 10) + '%'})),
    h('span', {class:'val', text:one(sc[p.id])}))));
  const mine = DATA.pick.product_id, top = rk[0], sum = C.reduce((a,c) => a + state.w[c.id], 0);
  $('#rank-note').textContent = sum === 0 ? L.rank_zero : top.id === mine ? L.rank_ok : fill(L.rank_other, {top:top.name, mine:byId[mine].name});
}
function autoGroups(sc){
  const val = f => Object.fromEntries(P.map(p => [p.id, f(p)]));
  return [
    {name:L.g_brief, rows:[
      {label:L.r_price, best:'low', values:val(p => { const o = bestOffer(p); return o ? {t:money(o.price), n:o.price} : null; })},
      {label:L.r_score, unit:'/10', best:'high', values:val(p => ({t:one(sc[p.id]), n:sc[p.id]}))},
      {label:L.r_conf, best:'none', values:val(p => L['c_' + p.data_confidence] || p.data_confidence)}]},
    {name:L.g_scores, rows:C.map(c => ({label:c.name, unit:'/10', best:'high', values:val(p => ({t:one(p.scores[c.id] || 0), n:p.scores[c.id] || 0}))}))}
  ].concat(DATA.feature_groups);
}
function renderPvis(){
  const box = $('#pvis'); box.replaceChildren();
  P.forEach(p => box.append(h('label', null,
    h('input', {type:'checkbox', checked:true, onchange: e => { e.target.checked ? state.hidden.delete(p.id) : state.hidden.add(p.id); renderTable(); }}),
    h('span', {text:p.name}))));
}
function renderTable(){
  const sc = scores(), prods = ordered(sc).filter(p => !state.hidden.has(p.id));
  const t = $('#tbl'); t.replaceChildren();
  const thead = h('thead', null, h('tr', null, h('th', {scope:'col', text:L.col_feature}),
    prods.map(p => h('th', {scope:'col'},
      p.id === DATA.pick.product_id && h('span', {class:'pickmark'}, L.mark),
      h('div', {text:p.name}),
      h('span', {class:'price', text: bestOffer(p) ? money(bestOffer(p).price) : L.price_na})))));
  const tb = h('tbody'); let shown = 0;
  const q = state.q.trim().toLowerCase();
  autoGroups(sc).forEach(g => {
    const rows = [];
    (g.rows || []).forEach(r => {
      if (q && r.label.toLowerCase().indexOf(q) < 0) return;
      const keys = prods.map(p => JSON.stringify(r.values[p.id] == null ? null : r.values[p.id]));
      if (state.diff && prods.length > 1 && keys.every(k => k === keys[0])) return;
      let best = null;
      if (state.hi && (r.best === 'high' || r.best === 'low')){
        const ns = prods.map(p => num(r.values[p.id])).filter(n => n != null);
        if (ns.length > 1){ const m = r.best === 'high' ? Math.max.apply(null, ns) : Math.min.apply(null, ns); if (ns.some(n => n !== m)) best = m; }
      }
      const cells = prods.map(p => {
        const v = r.values[p.id], n = num(v);
        const inner = v === true ? h('span', {class:'yes', text:L.yes}) : v === false ? h('span', {class:'no', text:L.no})
          : (v == null || v === '') ? h('span', {class:'nd', text:L.na}) : document.createTextNode(txt(v));
        return h('td', {class: best != null && n === best ? 'best' : ''}, inner);
      });
      rows.push(h('tr', null, h('th', {scope:'row'}, r.label, r.unit ? h('span', {class:'unit', text:' (' + r.unit + ')'}) : null, srcLinks(r.source), r.note && h('span', {class:'rownote', text:r.note})), cells));
    });
    if (rows.length){ tb.append(h('tr', {class:'grp'}, h('th', {colspan:String(prods.length + 1), text:g.name})), ...rows); shown += rows.length; }
  });
  t.append(thead, tb);
  const old = $('#empty'); if (old) old.remove();
  if (!shown) t.after(h('div', {class:'empty', id:'empty', text:L.nomatch}));
}
function renderOffers(){
  const box = $('#offers');
  $('#price-note').textContent = L.price_note;
  P.forEach(p => {
    const best = bestOffer(p);
    const offs = (p.offers || []).slice().sort((a,b) => (a.price == null) - (b.price == null) || a.price - b.price);
    box.append(h('div', {class:'panel'}, h('h3', {text:p.name, style:'margin-bottom:8px'}),
      offs.length ? offs.map(o => {
        const url = safeUrl(o.url);
        return h('div', {class:'offer' + (o === best ? ' best' : '')},
          h('div', null,
            h('div', {class:'shop'}, o.store, ' ', o === best && h('span', {class:'badge high', text:L.best_price}), o.verified === false && h('span', {class:'badge low', text:L.not_verified})),
            h('div', {class:'meta', text:[o.sold_by && fill(L.sold_by, {name:o.sold_by}), o.shipping, o.date && fill(L.verified_on, {date:dateFmt(o.date)}), o.note].filter(Boolean).join(' · ')})),
          h('div', {class:'amt', text: o.price != null ? money(o.price) : L.na}),
          url && h('a', Object.assign({class:'btn go' + (o === best ? ' primary' : ''), href:url}, ext), L.open_page));
      }) : h('p', {class:'muted', text:L.no_offers})));
  });
}
function renderSources(){
  const ul = $('#source-list');
  DATA.sources.forEach(f => {
    const url = safeUrl(f.url);
    ul.append(h('li', {id:'source-' + f.id},
      h('span', {class:'sid', text:f.id}),
      url ? h('a', Object.assign({class:'t', href:url, text:f.title}, ext)) : h('b', {class:'t', text:f.title}),
      h('span', {class:'badge neutral', text:L['t_' + f.type] || f.type}),
      h('span', {class:'badge ' + f.independence, text:L['i_' + f.independence] || f.independence}),
      h('span', {class:'sub', text:[f.publisher, f.date && dateFmt(f.date)].filter(Boolean).join(' · ')})));
  });
  const lim = $('#limits');
  (DATA.limits || []).forEach(l => lim.append(h('li', {text:l})));
  if (!(DATA.limits || []).length) lim.append(h('li', {text:L.no_limits}));
  $('#foot').textContent = DATA.meta.method || L.footer;
}

/* ---------- events ---------- */
function refresh(){ renderCards(); renderRanking(); renderTable(); }
function toggle(id, key, cb){
  const b = $(id);
  b.addEventListener('click', () => { state[key] = !state[key]; b.setAttribute('aria-pressed', String(state[key])); cb(); });
}
toggle('#t-diff', 'diff', renderTable);
toggle('#t-hi', 'hi', renderTable);
toggle('#t-sort', 'sort', renderTable);
$('#q').addEventListener('input', e => { state.q = e.target.value; renderTable(); });
$('#btn-reset').addEventListener('click', () => { C.forEach(c => state.w[c.id] = c.weight); renderSliders(); refresh(); });
$('#btn-print').addEventListener('click', () => window.print());
$('#btn-theme').addEventListener('click', () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
});

renderHeader(); renderPick(); renderSliders(); renderPvis(); renderOffers(); renderSources(); refresh();
})();
</script>
